name: DB Push Staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  db-push:
    name: Push staging database schema
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply migrations
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret="${{ vars.SECRET_DATABASE_MIGRATION_URL }}" --project="${{ vars.GCP_PROJECT_ID }}")" \
            pnpm -C lib/db run migrate
