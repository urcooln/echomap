kind = "web"
previewPath = "/echomap-command-center/"
title = "EchoMap Command Center"
description = "A focused SLP caseload workspace for reviewing recent communication changes, prioritizing children, and moving from shared observations to the next clear action."
version = "1.0.0"
id = "artifacts/echomap-command-center"
router = "path"

[[services]]
name = "web"
paths = [ "/echomap-command-center/" ]
localPort = 25878

[services.development]
run = "pnpm --filter @workspace/echomap-command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/echomap-command-center", "run", "build" ]
serve = "static"
publicDir = "artifacts/echomap-command-center/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25878"
BASE_PATH = "/echomap-command-center/"
