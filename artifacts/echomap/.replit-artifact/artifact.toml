kind = "web"
previewPath = "/"
title = "EchoMap"
description = "A collaborative communication dictionary for families, teachers, speech-language pathologists, and caregivers supporting children who are Gestalt Language Processors."
version = "1.0.0"
id = "artifacts/echomap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24157

[services.development]
run = "pnpm --filter @workspace/echomap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/echomap", "run", "build" ]
serve = "static"
publicDir = "artifacts/echomap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24157"
BASE_PATH = "/"
