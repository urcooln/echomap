        confidenceScore: { type: ["number", "null"], minimum: 0, maximum: 100 }
        competingRole:
          type: ["string", "null"]
          enum: [child, slp, parent, teacher, caregiver, unknown, null]
        competingScore: { type: ["number", "null"], minimum: 0, maximum: 100 }
        margin: { type: ["number", "null"], minimum: 0, maximum: 100 }
        signalCount: { type: number }
        signalSummary:
          type: array
          items: { $ref: "#/components/schemas/SpeakerRoleInferenceSignal" }
