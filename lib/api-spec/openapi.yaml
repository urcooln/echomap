openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries and activity
  - name: children
    description: Child profiles
  - name: gestalts
    description: Communication dictionary entries
  - name: collaboration
    description: Team notes and observations
  - name: sessions
    description: Secure therapy session reviews and notes
  - name: communication-goals
    description: Clinician-owned communication goals and evidence connections
  - name: security
    description: Security governance and administrator controls
  - name: owner-tools
    description: Super Admin role previews and experience testing
  - name: deletion-requests
    description: Child-data deletion requests and staff review
  - name: clinical-knowledge
    description: Clinician-curated knowledge sources and cited advisory insights
  - name: parent-learning
    description: Family-only educational learning resources and private progress
  - name: clinician-learning
    description: Clinician-only educational resources, quick references, and private progress
paths:
  /communication-goals:
    get:
      operationId: listCommunicationGoals
      tags: [communication-goals]
      summary: List clinician-managed communication goals for an authorized child
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Child communication goals, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CommunicationGoal" } } } } }
        "403": { description: Clinician and child access required }
    post:
      operationId: createCommunicationGoal
      tags: [communication-goals]
      summary: Create a clinician-managed communication goal
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CommunicationGoalInput" } } }
      responses:
        "201": { description: Created goal, content: { application/json: { schema: { $ref: "#/components/schemas/CommunicationGoal" } } } }
        "403": { description: Clinician and child access required }
  /communication-goals/{goalId}:
    patch:
      operationId: updateCommunicationGoal
      tags: [communication-goals]
      summary: Update, archive, or reactivate a communication goal with optimistic versioning
      parameters:
        - in: path
          name: goalId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CommunicationGoalUpdate" } } }
      responses:
        "200": { description: Updated goal, content: { application/json: { schema: { $ref: "#/components/schemas/CommunicationGoal" } } } }
        "403": { description: Clinician and child access required }
        "404": { description: Goal not found }
        "409": { description: Goal version changed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /clinician-overview:
    get:
      operationId: getClinicianOverview
      tags: [dashboard]
      summary: Get the clinician caseload overview
      description: Returns organization- and assignment-scoped counts and recent activity for the clinician landing page.
      parameters:
        - in: query
          name: since
          required: false
          description: ISO timestamp marking the clinician's previous signed-in overview visit.
          schema: { type: string }
      responses:
        "200":
          description: Clinician caseload overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianOverview"
        "401": { description: Authentication required }
        "403": { description: Clinician access required }
  /teacher-overview:
    get:
      operationId: getTeacherOverview
      tags: [dashboard]
      summary: Get the teacher classroom overview
      description: Returns organization- and assignment-scoped teacher-safe counts and recent activity for the classroom landing page.
      parameters:
        - in: query
          name: since
          required: false
          description: ISO timestamp marking the teacher's previous signed-in overview visit.
          schema: { type: string }
      responses:
        "200":
          description: Teacher classroom overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianOverview"
        "401": { description: Authentication required }
        "403": { description: Teacher access required }
  /teacher-phrase-lookup:
    get:
      operationId: getTeacherPhraseLookup
      tags: [dashboard]
      summary: Look up documented phrase meanings for one assigned student
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: integer }
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Teacher-safe phrase matches from the selected assigned student's dictionary
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherPhraseLookupResult" }
        "401": { description: Authentication required }
        "403": { description: Teacher access required }
  /frequent-scripts:
    get:
      operationId: getFrequentScripts
      tags: [dashboard]
      summary: Get ranked frequent scripts from confirmed child evidence
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: window
          required: false
          schema: { type: string, enum: [all, 30d, 7d], default: all }
      responses:
        "200":
          description: Ranked frequent scripts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrequentScripts"
  /recurring-language-patterns:
    get:
      operationId: getRecurringLanguagePatterns
      tags: [dashboard]
      summary: Get recurring language patterns from confirmed Child evidence
      description: Returns observational phrase fragments shared by multiple confirmed Child phrases. This does not infer NLA stage, diagnosis, treatment, or AAC conclusions.
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: window
          required: false
          schema: { type: string, enum: [all, 30d, 7d], default: all }
      responses:
        "200":
          description: Recurring language pattern summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringLanguagePatterns"
        "401": { description: Authentication required }
        "403": { description: Clinician access required }
  /recurring-language-pattern-detail:
    get:
      operationId: getRecurringLanguagePatternDetail
      tags: [dashboard]
      summary: Get evidence references for one recurring language pattern
      parameters:
        - in: query
          name: patternId
          required: true
          schema: { type: string }
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: window
          required: false
          schema: { type: string, enum: [all, 30d, 7d], default: all }
      responses:
        "200":
          description: Recurring language pattern evidence detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringLanguagePatternDetail"
        "401": { description: Authentication required }
        "403": { description: Clinician access required }
        "404": { description: Pattern not found }
  /parent-learning-center:
    get:
      operationId: getParentLearningCenter
      tags: [parent-learning]
      summary: Get the family Parent Coaching Learning Center
      description: Returns clinician-authored educational handbook modules and the authenticated family member's private progress for a selected child.
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Family learning center
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLearningCenter" }
        "401": { description: Authentication required }
        "403": { description: "Parent, caregiver, or authorized family access required" }
  /parent-learning-center/module:
    get:
      operationId: getParentLearningModule
      tags: [parent-learning]
      summary: Get one family learning module
      parameters:
        - in: query
          name: moduleKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Family learning module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLearningModuleDetail" }
        "401": { description: Authentication required }
        "403": { description: "Parent, caregiver, or authorized family access required" }
        "404": { description: Learning module not found }
  /parent-learning-center/progress:
    put:
      operationId: updateParentLearningProgress
      tags: [parent-learning]
      summary: Save private family learning progress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentLearningProgressInput" }
      responses:
        "200":
          description: Saved private family learning progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLearningProgress" }
        "401": { description: Authentication required }
        "403": { description: "Parent, caregiver, or authorized family access required" }
        "404": { description: Learning module not found }
  /parent-learning-center/reflection:
    put:
      operationId: updateParentLearningReflection
      tags: [parent-learning]
      summary: Save a private family reflection
      description: Saves an optional reflection that is private to the authenticated family account and selected child. It is not a clinical record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentLearningReflectionInput" }
      responses:
        "200":
          description: Saved private family reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLearningReflection" }
        "401": { description: Authentication required }
        "403": { description: "Parent, caregiver, or authorized family access required" }
        "404": { description: Learning module not found }
  /parent-learning-center/download:
    get:
      operationId: downloadParentLearningHandbook
      tags: [parent-learning]
      summary: Download the private Parent Coaching Handbook
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Authenticated handbook PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Authentication required }
        "403": { description: "Parent, caregiver, or authorized family access required" }
        "404": { description: Handbook not found }
  /teacher-resource-center:
    get:
      operationId: getTeacherResourceCenter
      tags: [parent-learning]
      summary: Get the teacher resource center
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200": { description: Teacher resources, content: { application/json: { schema: { $ref: "#/components/schemas/TeacherResourceCenter" } } } }
        "401": { description: Authentication required }
        "403": { description: "Authorized teacher access required" }
  /teacher-resource-center/progress:
    put:
      operationId: updateTeacherResourceProgress
      tags: [parent-learning]
      summary: Save teacher resource progress
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TeacherResourceProgressInput" } } }
      responses:
        "200": { description: Saved progress, content: { application/json: { schema: { $ref: "#/components/schemas/TeacherResourceProgress" } } } }
        "401": { description: Authentication required }
        "403": { description: "Authorized teacher access required" }
  /teacher-resource-center/download:
    get:
      operationId: downloadTeacherResourceHandbook
      tags: [parent-learning]
      summary: Download teacher resources handbook
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200": { description: Protected teacher handbook PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { description: Authentication required }
        "403": { description: "Authorized teacher access required" }
  /clinician-learning-center:
    get:
      operationId: getClinicianLearningCenter
      tags: [clinician-learning]
      summary: Get the clinician learning center
      responses:
        "200": { description: Clinician learning modules and progress, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicianLearningCenter" } } } }
        "401": { description: Authentication required }
        "403": { description: Authorized clinician access required }
  /clinician-learning-center/progress:
    put:
      operationId: updateClinicianLearningProgress
      tags: [clinician-learning]
      summary: Save clinician learning progress
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicianLearningProgressInput" } } }
      responses:
        "200": { description: Saved progress, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicianLearningProgress" } } } }
        "401": { description: Authentication required }
        "403": { description: Authorized clinician access required }
  /clinician-learning-center/preferences:
    get:
      operationId: getClinicianLearningPreferences
      tags: [clinician-learning]
      summary: Get clinician workflow coaching preference
      responses:
        "200": { description: Clinician learning preferences, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicianLearningPreferences" } } } }
        "401": { description: Authentication required }
        "403": { description: Authorized clinician access required }
    put:
      operationId: updateClinicianLearningPreferences
      tags: [clinician-learning]
      summary: Update clinician workflow coaching preference
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicianLearningPreferencesInput" } } }
      responses:
        "200": { description: Updated preferences, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicianLearningPreferences" } } } }
        "401": { description: Authentication required }
        "403": { description: Authorized clinician access required }
  /clinician-learning-center/download:
    get:
      operationId: downloadClinicianLearningHandbook
      tags: [clinician-learning]
      summary: Download the clinician learning handbook
      responses:
        "200": { description: Protected clinician handbook, content: { text/plain: { schema: { type: string, format: binary } } } }
        "401": { description: Authentication required }
        "403": { description: Authorized clinician access required }
  /auth/viewer:
    get:
      operationId: getViewer
      tags: [security]
      summary: Get the authenticated viewer and active role preview
      responses:
        "200":
          description: Authenticated viewer context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewer" }
        "401": { description: Authentication required }
        "403": { description: Verified invited care-team account required }
  /admin/security-overview:
    get:
      operationId: getAdminSecurityOverview
      tags: [security]
      summary: Get the administrator security overview
      responses:
        "200":
          description: Security governance overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSecurityOverview"
  /admin/team-conversations:
    get:
      operationId: listAdminTeamConversations
      tags: [security]
      summary: Search organization-scoped child team conversations
      parameters:
        - in: query
          name: student
          schema: { type: string, maxLength: 160 }
        - in: query
          name: phrase
          schema: { type: string, maxLength: 240 }
        - in: query
          name: sender
          schema: { type: string, maxLength: 160 }
        - in: query
          name: date
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - in: query
          name: keyword
          schema: { type: string, maxLength: 240 }
        - in: query
          name: limit
          schema: { type: number, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Organization-scoped team message results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTeamConversationSearch" }
        "403": { description: Administrator access required }
  /admin/child-permissions:
    get:
      operationId: getAdminChildPermissions
      tags: [security]
      summary: List organization members and their active assignment for a child
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Child-scoped care-team permission roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChildPermissions" }
        "403": { description: Administrator access required }
        "404": { description: Child not found in organization }
  /admin/child-permissions/{userId}:
    patch:
      operationId: updateAdminChildPermission
      tags: [security]
      summary: Change an organization member's active child-team assignment
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminChildPermissionInput" }
      responses:
        "200":
          description: Updated child-team permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChildPermission" }
        "403": { description: Administrator access required }
        "404": { description: Child or organization member not found }
  /admin/role-preview:
    post:
      operationId: setRolePreview
      tags: [owner-tools]
      summary: Start or change a Super Admin role preview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePreviewInput" }
      responses:
        "200":
          description: Active role preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewer" }
        "401": { description: Authentication required }
        "403": { description: Super Admin access required }
    delete:
      operationId: clearRolePreview
      tags: [owner-tools]
      summary: Return a Super Admin to the owner view
      responses:
        "200":
          description: Owner viewer context with no active preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewer" }
        "401": { description: Authentication required }
        "403": { description: Super Admin access required }
  /admin/ux-testing:
    get:
      operationId: getAdminUxTesting
      tags: [owner-tools]
      summary: Get the Super Admin experience testing catalog
      responses:
        "200":
          description: Role permission comparison and safe sample-user workflows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUxTesting" }
        "401": { description: Authentication required }
        "403": { description: Super Admin access required }
  /admin/retention:
    put:
      operationId: updateRetentionSettings
      tags: [security]
      summary: Update organization retention settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionSettingsInput"
      responses:
        "200":
          description: Updated retention settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionSettings"
  /reports/export:
    post:
      operationId: recordReportExport
      tags: [security]
      summary: Record an authorized report export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportExportInput"
      responses:
        "201":
          description: Export audit event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExportEvent"
  /clinical-documentation:
    get:
      operationId: listClinicalDocumentation
      tags: [sessions]
      summary: List authorized session notes across the clinician caseload
      parameters:
        - in: query
          name: childId
          required: false
          schema: { type: number }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, draft, finalized, archived, recently_deleted]
        - in: query
          name: search
          required: false
          schema: { type: string, maxLength: 240 }
      responses:
        "200":
          description: Organization- and child-access-scoped session notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentationList" }
        "403": { description: Clinician access and child access required }
    delete:
      operationId: deleteClinicalDocumentation
      tags: [sessions]
      summary: Move a draft to Recently Deleted or archive a finalized note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleInput" }
      responses:
        "200":
          description: Documentation lifecycle transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleResult" }
        "403": { description: Clinician access and child access required }
        "409": { description: The note is already in an incompatible lifecycle state }
    post:
      operationId: createClinicalDocumentation
      tags: [sessions]
      summary: Generate and save an editable clinician documentation draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationCreateInput" }
      responses:
        "201":
          description: Editable clinician documentation draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentation" }
        "403": { description: Clinician access and child access required }
    put:
      operationId: updateClinicalDocumentation
      tags: [sessions]
      summary: Save edits to a clinician documentation draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationUpdateInput" }
      responses:
        "200":
          description: Saved clinician documentation draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentation" }
        "403": { description: Clinician access and child access required }
        "404": { description: Editable documentation draft not found }
  /clinical-documentation/approve:
    post:
      operationId: approveClinicalDocumentation
      tags: [sessions]
      summary: Finalize a clinician documentation draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationApproveInput" }
      responses:
        "200":
          description: Finalized clinician documentation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentation" }
        "403": { description: Clinician access and child access required }
        "404": { description: Documentation draft not found }
  /clinical-documentation/restore:
    post:
      operationId: restoreClinicalDocumentation
      tags: [sessions]
      summary: Restore a note from Recently Deleted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleInput" }
      responses:
        "200":
          description: Restored documentation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleResult" }
        "403": { description: Clinician access and child access required }
        "409": { description: The recovery window has expired or the note cannot be restored }
  /clinical-documentation/archive:
    post:
      operationId: archiveClinicalDocumentation
      tags: [sessions]
      summary: Archive a finalized note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleInput" }
      responses:
        "200":
          description: Archived documentation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleResult" }
        "403": { description: Clinician access and child access required }
        "409": { description: Only finalized notes can be archived }
  /clinical-documentation/archive/restore:
    post:
      operationId: restoreArchivedClinicalDocumentation
      tags: [sessions]
      summary: Restore an archived note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleInput" }
      responses:
        "200":
          description: Restored finalized documentation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentationLifecycleResult" }
        "403": { description: Clinician access and child access required }
        "409": { description: Only archived notes can be restored }
  /clinical-documentation/ai-session-note:
    post:
      operationId: createAiSessionNote
      tags: [sessions]
      summary: Generate an editable AI-assisted session note from reviewed Child utterances
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSessionNoteCreateInput" }
      responses:
        "201":
          description: Editable AI-assisted session note draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalDocumentation" }
        "403": { description: Clinician access and child access required }
        "409": { description: Every transcript turn must be reviewed before generation }
        "422": { description: No eligible confirmed Child utterances were found }
        "502": { description: The AI provider could not generate the draft }
  /session-soap-note:
    get:
      operationId: getSessionSoapNote
      tags: [sessions]
      summary: Get a clinician-reviewable SOAP note draft from a reviewed session
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: sessionId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Session-scoped editable SOAP note and confirmed evidence
          content:
