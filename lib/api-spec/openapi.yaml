      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Clinician-led longitudinal unclear-vocalization review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnclearVocalizationReview"
        "403": { description: SLP access and assigned child access required }
  /sessions/unclear-vocalizations/labels:
    patch:
      operationId: updateUnclearVocalizationLabel
      tags: [sessions]
      summary: Apply or revise a clinician-owned cross-session label without changing provider text or phrase evidence
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnclearVocalizationLabelInput"
      responses:
        "200":
          description: Refreshed longitudinal unclear-vocalization review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnclearVocalizationReview"
        "409":
          description: One or more occurrences changed after the clinician opened the review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnclearVocalizationConflict"
        "403": { description: SLP access and assigned child access required }
  /sessions/audio/upload-url:
    post:
      operationId: requestSessionAudioUpload
      tags: [sessions]
      summary: Reserve a private therapy recording upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionAudioUploadRequest"
      responses:
        "201":
          description: Private recording upload URL and reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAudioUpload"
        "400":
          description: Invalid recording or missing consent confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "403":
          description: Child access or role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
  /sessions/preparation:
    post:
      operationId: prepareSessionRecording
      tags: [sessions]
      summary: Create a short-lived private recording preparation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRecordingPreparationRequest"
      responses:
        "201":
          description: A private preparation boundary for calibration and recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecordingPreparation"
        "401": { description: Authentication required }
        "403": { description: Child access or role is not permitted }
  /sessions/calibration/complete:
    post:
      operationId: completeSessionCalibration
      tags: [sessions]
      summary: Finalize a private speaker calibration reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCalibrationCompletionRequest"
      responses:
        "200":
          description: Ready session-scoped calibration reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCalibration"
        "400":
          description: Invalid calibration duration or incomplete upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "401": { description: Authentication required }
        "403": { description: Child access or role is not permitted }
        "404": { description: Calibration upload was not found }
        "409":
          description: Calibration state changed before completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "503":
          description: Calibration finalization is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
  /sessions/calibration:
    delete:
      operationId: deleteSessionCalibration
      tags: [sessions]
      summary: Revoke an unfinished private speaker calibration reference
      parameters:
        - in: query
          name: audioId
          required: true
          schema: { type: string }
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "204": { description: Calibration reference deleted }
        "401": { description: Authentication required }
        "403": { description: Child access or role is not permitted }
        "404": { description: Calibration upload was not found }
  /sessions/audio/limits:
    get:
      operationId: getSessionAudioLimits
      tags: [sessions]
      summary: Get the active private recording upload limits
      responses:
        "200":
          description: Current audio, video, and provider-size limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAudioLimits"
  /sessions/transcription:
    post:
      operationId: transcribeSessionAudio
      tags: [sessions]
      summary: Transcribe and segment a private therapy recording
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionTranscriptionInput"
      responses:
        "200":
          description: Existing completed transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
        "400":
          description: Invalid transcription request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "403":
          description: Child access or role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "404":
          description: Recording was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
        "502":
          description: The configured transcription provider could not complete the recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDiagnosticError"
  /sessions/transcription/draft:
    get:
      operationId: getSessionTranscriptionDraft
      tags: [sessions]
      summary: Reopen an explicitly selected unsaved transcript review
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: transcriptId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Explicitly selected unsaved transcript review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
        "403": { description: Clinician access and child access required }
        "404": { description: No unsaved transcript review }
  /sessions/transcription/{transcriptId}/audio:
    get:
      operationId: getSessionTranscriptionAudio
      tags: [sessions]
      summary: Stream the private recording for an unsaved transcript review
      parameters:
        - in: path
          name: transcriptId
          required: true
          schema: { type: number }
      responses:
        "200": { description: Private therapy recording }
        "403": { description: Clinician access and child access required }
        "404": { description: Recording not found }
  /sessions/transcription/speakers:
    post:
      operationId: updateTranscriptSpeakers
      tags: [sessions]
      summary: Assign clinician-reviewed speaker roles to a transcript
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptSpeakerAssignmentsInput"
      responses:
        "200":
          description: Updated transcript with child-only phrase candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
        "201":
          description: Completed transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
  /sessions/transcription/child-utterances:
    post:
      operationId: updateTranscriptChildUtterances
      tags: [sessions]
      summary: Classify transcript utterances for Child-language review
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptChildUtteranceReviewsInput"
      responses:
        "200":
          description: Updated transcript with durable utterance review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
        "400": { description: Invalid Child utterance review }
        "403": { description: Clinician access and child access required }
        "404": { description: Transcript not found }
  /sessions/transcription/phrase-inbox:
    get:
      operationId: listChildPhraseInbox
      tags: [sessions]
      summary: List durable Child phrase inbox items
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
        - in: query
          name: transcriptId
          required: false
          schema: { type: number }
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/ChildPhraseInboxStatus"
      responses:
        "200":
          description: Child-scoped phrase inbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranscriptPhraseInboxItem"
        "403": { description: Clinician access and child access required }
  /sessions/transcription/phrase-inbox/{itemId}:
    patch:
      operationId: updateChildPhraseInbox
      tags: [sessions]
      summary: Defer or add working meaning to a Child phrase inbox item
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptPhraseInboxUpdate"
      responses:
        "200":
          description: Updated phrase inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPhraseInboxUpdateResult"
        "400": { description: Invalid phrase inbox update }
        "403": { description: Clinician access and child access required }
        "404": { description: Phrase inbox item not found }
  /sessions/transcription/provisional-phrases:
    post:
      operationId: updateTranscriptProvisionalPhrases
      tags: [sessions]
      summary: Review mixed-speaker provisional phrase candidates
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionalPhraseReviewsInput"
      responses:
        "200":
          description: Updated provisional review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
        "400": { description: Invalid provisional phrase review }
        "403": { description: Clinician access and child access required }
        "404": { description: Transcript not found }
  /sessions/{sessionId}/audio:
    get:
      operationId: getSessionAudio
      tags: [sessions]
      summary: Stream a private therapy recording
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Audio recording
          content:
            audio/webm: {}
            audio/mp4: {}
        "404":
          description: Recording not found
  /clinical-knowledge/sources:
    get:
      operationId: listClinicalKnowledgeSources
      tags: [clinical-knowledge]
      summary: List the active organization knowledge sources
      responses:
        "200":
          description: Knowledge sources available for grounded suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalKnowledgeSourceList"
        "403": { description: Clinician access required }
    post:
      operationId: createClinicalKnowledgeSource
      tags: [clinical-knowledge]
      summary: Upload and process a private clinical knowledge source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicalKnowledgeSourceInput"
      responses:
        "201":
          description: Processed source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalKnowledgeSource"
        "400": { description: Invalid or unreadable source document }
        "403": { description: Clinician access required }
  /clinical-knowledge/sources/{sourceId}/archive:
    post:
      operationId: archiveClinicalKnowledgeSource
      tags: [clinical-knowledge]
      summary: Archive a knowledge source without destroying its provenance
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Archived source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalKnowledgeSource"
        "403": { description: Clinician access required }
        "404": { description: Source not found }
  /clinical-knowledge/insights:
    get:
      operationId: listClinicalKnowledgeInsights
      tags: [clinical-knowledge]
      summary: List automatically refreshed insight records for an assigned child
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Applied, monitoring, draft, and exception insight records with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalKnowledgeInsightList"
        "403": { description: Clinician and child access required }
    post:
      operationId: generateClinicalKnowledgeInsights
      tags: [clinical-knowledge]
      summary: Retry or refresh the background cited-insight engine for reviewed evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicalKnowledgeInsightRequest"
      responses:
        "201":
          description: Current clinician-review exceptions after the refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalKnowledgeInsightList"
        "400": { description: No reviewed evidence or ready knowledge sources }
        "403": { description: Clinician and child access required }
  /clinical-knowledge/insights/{insightId}:
    patch:
      operationId: reviewClinicalKnowledgeInsight
      tags: [clinical-knowledge]
      summary: Save a clinician annotation or reverse an automatic applied fact
      parameters:
        - in: path
          name: insightId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicalKnowledgeInsightReviewInput"
      responses:
        "200":
          description: Updated insight draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalKnowledgeInsight"
        "403": { description: Clinician and child access required }
        "404": { description: Insight not found }
  /deletion-requests:
    get:
      operationId: listDeletionRequests
      tags: [deletion-requests]
      summary: List deletion requests visible to the signed-in user
      security: [{ ClerkSession: [] }]
      parameters:
        - in: query
          name: childId
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Visible deletion requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeletionRequest" }
        "401": { description: Sign-in required }
        "403": { description: Child-scoped access required }
    post:
      operationId: createDeletionRequest
      tags: [deletion-requests]
      summary: Request deletion of selected child data
      security: [{ ClerkSession: [] }]
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionRequestInput" }
      responses:
        "201":
          description: Created deletion request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionRequest" }
  /deletion-requests/{requestId}:
    get:
      operationId: getDeletionRequest
      tags: [deletion-requests]
      summary: Get a deletion request and immutable audit history
      security: [{ ClerkSession: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Deletion request detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionRequestDetail" }
    post:
      operationId: reviewDeletionRequest
      tags: [deletion-requests]
      summary: Approve or reject a deletion request
      security: [{ ClerkSession: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionRequestReviewInput" }
      responses:
        "200":
          description: Reviewed deletion request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionRequestDetail" }
        "409": { description: Request was already reviewed }
  /deletion-requests/{requestId}/reconcile:
    post:
      operationId: reconcileDeletionRequest
      tags: [deletion-requests]
      summary: Safely retry or reconcile a processing deletion request
      security: [{ ClerkSession: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: number }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionRequestReconcileInput" }
      responses:
        "200":
          description: Reconciled deletion request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionRequestDetail" }
        "403": { description: Authorized staff access required }
        "409": { description: Request cannot be reconciled or is already processing }
  /beta-access-requests:
    post:
      operationId: createBetaAccessRequest
      tags: [security]
      summary: Submit a private beta access request
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessRequestInput" } } } }
      responses:
        "201": { description: Received request, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessRequestStatus" } } } }
        "400": { description: Invalid request }
  /invitations/validate:
    get:
      operationId: validateInvitation
      tags: [security]
      summary: Safely validate an opaque invitation token
      parameters: [{ in: query, name: token, required: true, schema: { type: string } }]
      responses: { "200": { description: Safe invitation metadata, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationValidation" } } } } }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [security]
      summary: Accept an invitation with the signed-in verified email
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationAcceptanceInput" } } } }
      responses: { "200": { description: Accepted invitation, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationAcceptance" } } } }, "403": { description: Invitation cannot be accepted } }
  /beta-notice:
    get:
      operationId: getBetaNotice
      tags: [security]
      summary: Get the current beta participation notice
      responses: { "200": { description: Current beta notice, content: { application/json: { schema: { $ref: "#/components/schemas/BetaNotice" } } } }, "401": { description: Authentication required } }
  /beta-notice/acknowledge:
    post:
      operationId: acknowledgeBetaNotice
      tags: [security]
      summary: Acknowledge the current beta participation notice
      responses: { "200": { description: Acknowledged notice, content: { application/json: { schema: { $ref: "#/components/schemas/BetaNoticeAcknowledgement" } } } }, "401": { description: Authentication required } }
  /admin/beta-access-requests:
    get:
      operationId: listBetaAccessRequests
      tags: [security]
      summary: List beta access requests for super administrators
      responses: { "200": { description: Beta request queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BetaAccessRequestAdmin" } } } } }, "403": { description: Super Admin access required } }
  /admin/beta-controls:
    get:
      operationId: getBetaControls
      tags: [security]
      summary: Get singleton private beta controls
      responses: { "200": { description: Beta controls, content: { application/json: { schema: { $ref: "#/components/schemas/BetaControls" } } } } }
    patch:
      operationId: updateBetaControls
      tags: [security]
      summary: Update singleton private beta controls
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BetaControlsInput" } } } }
      responses: { "200": { description: Updated beta controls, content: { application/json: { schema: { $ref: "#/components/schemas/BetaControls" } } } }, "403": { description: Super Admin access required } }
  /admin/beta-access-requests/{id}/approve:
    post:
      operationId: approveBetaAccessRequest
      tags: [security]
      summary: Approve a beta access request
      parameters: [{ in: path, name: id, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessApprovalInput" } } } }
      responses: { "200": { description: Updated request, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessRequestAction" } } } }, "403": { description: Super Admin access required } }
  /admin/beta-access-requests/{id}/reject:
    post:
      operationId: rejectBetaAccessRequest
      tags: [security]
      summary: Reject a beta access request
      parameters: [{ in: path, name: id, required: true, schema: { type: number } }]
      responses: { "200": { description: Updated request, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessRequestAction" } } } }, "403": { description: Super Admin access required } }
  /admin/beta-access-requests/{id}/archive:
    post:
      operationId: archiveBetaAccessRequest
      tags: [security]
      summary: Archive a beta access request
      parameters: [{ in: path, name: id, required: true, schema: { type: number } }]
      responses: { "200": { description: Updated request, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessRequestAction" } } } }, "403": { description: Super Admin access required } }
  /admin/access-controls/revoke-invitations:
    post:
      operationId: revokeBetaInvitations
      tags: [security]
      summary: Revoke all active private-beta invitations
      responses: { "200": { description: Revocation result, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessControlResult" } } } }, "403": { description: Super Admin access required } }
  /admin/access-controls/{type}/{id}/{action}:
    post:
      operationId: updateBetaAccessControl
      tags: [security]
      summary: Emergency disable or enable a user or organization
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [users, organizations] } }
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: action, required: true, schema: { type: string, enum: [disable, enable] } }
      responses: { "200": { description: Access control result, content: { application/json: { schema: { $ref: "#/components/schemas/BetaAccessControlResult" } } } }, "403": { description: Super Admin access required } }
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Viewer:
      type: object
      required: [userId, name, role, actualRole, childIds, isAdmin, isSuperAdmin, isRolePreview, isDevelopmentDemo, previewRole]
      properties:
        userId: { type: string }
        name: { type: string }
        role: { type: string, enum: [SLP, Parent, Teacher, Administrator] }
        actualRole: { type: string, enum: [SLP, Parent, Teacher, Administrator] }
        childIds: { type: array, items: { type: number } }
        isAdmin: { type: boolean }
        isSuperAdmin: { type: boolean }
        isRolePreview: { type: boolean }
        isDevelopmentDemo: { type: boolean }
        previewRole: { type: ["string", "null"], enum: [SLP, Parent, Teacher, Administrator, null] }
    RolePreviewInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [SLP, Parent, Teacher, Administrator] }
    AdminUxTesting:
      type: object
      required: [sampleUser, permissions, workflows]
      properties:
        sampleUser: { $ref: "#/components/schemas/PreviewSampleUser" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PreviewPermission" }
        workflows:
          type: array
          items: { $ref: "#/components/schemas/PreviewWorkflow" }
    PreviewSampleUser:
      type: object
      required: [displayName, email, role, childName, description]
      properties:
        displayName: { type: string }
        email: { type: string }
        role: { type: string, enum: [SLP, Parent, Teacher, Administrator] }
        childName: { type: string }
        description: { type: string }
    PreviewPermission:
      type: object
      required: [role, label, capabilities]
      properties:
        role: { type: string, enum: [SLP, Parent, Teacher, Administrator] }
        label: { type: string }
        capabilities: { type: array, items: { type: string } }
    PreviewWorkflow:
      type: object
      required: [label, path, description, roles]
      properties:
        label: { type: string }
        path: { type: string }
        description: { type: string }
        roles: { type: array, items: { type: string, enum: [SLP, Parent, Teacher, Administrator] } }
